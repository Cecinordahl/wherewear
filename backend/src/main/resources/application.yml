server:
  port: ${PORT:8080}
  error:
    # Personal single-user app - safe trade-off to surface the actual reason
    # (e.g. "That URL isn't a readable image") instead of Spring's default
    # blanked-out message, so failures are debuggable from the frontend alone.
    include-message: always

wherewear:
  # Path to the Firebase service account JSON key file (see README for how to get one).
  # Locally, point this at a file on disk. On Render, we instead read the JSON
  # directly from an env var (FIREBASE_SERVICE_ACCOUNT_JSON) - see FirebaseConfig.
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  cors:
    allowed-origins: ${WHEREWEAR_ALLOWED_ORIGINS:http://localhost:5173,https://wherewear.vercel.app}
  serpapi:
    # Free-tier key from serpapi.com (100 searches/month). See README "Product photo lookup" section.
    api-key: ${SERPAPI_API_KEY:}
  gemini:
    # Free-tier key from Google AI Studio (aistudio.google.com). See README "Receipt import" section.
    api-key: ${GEMINI_API_KEY:}
    # "-latest" alias so Google's routine model retirements (gemini-2.0-flash,
    # then gemini-2.5-flash, both retired within 2026) don't break this again -
    # override via env var if the alias itself is ever removed. See README
    # "Receipt import" section.
    model: ${GEMINI_MODEL:gemini-flash-latest}

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

logging:
  level:
    com.wherewear: INFO
